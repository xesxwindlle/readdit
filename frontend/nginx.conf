# can have multiple servers with server{} block
server { 
    listen 80; # Port 80 = standard HTTP. Got handled when http://yourdomain.com is visited

    location / {
        # Tells Nginx where the static files are stored.
        root   /usr/share/nginx/html; # Nginx default location
        index  index.html;
        try_files $uri $uri/ /index.html; 
        # 1. Try to find the exact files ($uri)
        # 2. If not found, try as a folder ($uri/)
        # 3. If still not found → return /index.html and vue handles the routing
    }

    location /api/data/ {
        # Strip the /api/data prefix before forwarding (controllers are at / not /api/data/)
        rewrite ^/api/data/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
    }

    location /api/chat {
        # Chat endpoint is already at /api/chat on the backend, no rewrite needed
        proxy_pass http://backend:8080;
    }
}
