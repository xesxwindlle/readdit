spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/readdit}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# Spring Data REST
spring.data.rest.base-path=/api/data

# Spring Boot
server.forward-headers-strategy=FRAMEWORK

# OpenRouter
openrouter.api.key=${OPENROUTER_API_KEY}

# LLM Logging
logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.ai.openai=TRACE

# Profile Switch
spring.profiles.active=llm-prompt


# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# Max POST body size (10MB) — needed for base64-encoded cover images in JSON
server.tomcat.max-http-form-post-size=10485760

# enable logging for DDEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.datasource.init.ScriptUtils=DEBUG