apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: readdit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        # Wait for MySQL to be ready before starting Spring Boot
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mysql 3306; do echo "Waiting for MySQL..."; sleep 3; done
      containers:
        - name: backend
          image: readdit-backend
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/readdit
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: readdit-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: readdit-secrets
                  key: APP_JWT_SECRET
            - name: APP_JWT_EXPIRATION
              value: "86400000"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: readdit-secrets
                  key: OPENROUTER_API_KEY
